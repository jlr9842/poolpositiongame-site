<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="icon" href="/img/icon-prosim.png">
<link rel="stylesheet" href="/style.css"></head>
<body class="page">
<div class="bar"><div class="wrap">

<script>
  var m = location.pathname.match(/^\/t\/([A-Za-z0-9-]{1,16})\/?$/);
  if (m) {
    document.getElementById('code').textContent = m[1];
    document.getElementById('table').hidden = false;
    document.getElementById('missing').hidden = true;
    document.title = 'Join a table · Pool Position: ProSim';
